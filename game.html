<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมยิงนก</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 70%, #228B22 100%);
        }

        #gameInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #45a049;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="gameInfo">
        <div>คะแนน: <span id="score">0</span></div>
        <div>กระสุน: <span id="ammo">10</span></div>
        <div>เวลา: <span id="time">60</span>s</div>
    </div>

    <div id="gameOver">
        <h2>เกมจบแล้ว!</h2>
        <p>คะแนนสุดท้าย: <span id="finalScore">0</span></p>
        <button onclick="startGame()">เล่นใหม่</button>
    </div>

    <!-- เมฆ -->
    <div class="cloud" style="width: 80px; height: 40px; top: 20%; left: 10%; animation: moveCloud 20s linear infinite;"></div>
    <div class="cloud" style="width: 60px; height: 30px; top: 15%; right: 20%; animation: moveCloud 25s linear infinite reverse;"></div>
    <div class="cloud" style="width: 100px; height: 50px; top: 10%; left: 60%; animation: moveCloud 30s linear infinite;"></div>

    <style>
        @keyframes moveCloud {
            from { transform: translateX(-100px); }
            to { transform: translateX(900px); }
        }
    </style>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = {
            score: 0,
            ammo: 10,
            timeLeft: 60,
            gameRunning: false,
            birds: [],
            bullets: [],
            gameInterval: null,
            spawnInterval: null
        };

        class Bird {
            constructor() {
                this.x = -50;
                this.y = Math.random() * (canvas.height - 200) + 50;
                this.speed = 2 + Math.random() * 3;
                this.size = 20 + Math.random() * 15;
                this.wingFlap = 0;
                this.color = this.getRandomColor();
                this.points = Math.floor(this.size / 5);
            }

            getRandomColor() {
                const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speed;
                this.wingFlap += 0.3;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                
                // ร่างกาย
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size/2, this.size/3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // หัว
                ctx.beginPath();
                ctx.ellipse(this.size/3, -this.size/6, this.size/3, this.size/4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // ปีก
                const wingFlap = Math.sin(this.wingFlap) * 0.3;
                ctx.fillStyle = this.darkenColor(this.color);
                
                // ปีกซ้าย
                ctx.beginPath();
                ctx.ellipse(-this.size/4, wingFlap, this.size/2, this.size/6, -0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // ปีกขวา
                ctx.beginPath();
                ctx.ellipse(-this.size/4, -wingFlap, this.size/2, this.size/6, 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // ตา
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.size/3, -this.size/6, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // จะงอยปาก
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo(this.size/2, -this.size/6);
                ctx.lineTo(this.size/2 + 8, -this.size/6);
                ctx.lineTo(this.size/2 + 4, -this.size/6 + 4);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }

            darkenColor(color) {
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                return `rgb(${Math.floor(r*0.7)}, ${Math.floor(g*0.7)}, ${Math.floor(b*0.7)})`;
            }

            isHit(x, y) {
                const distance = Math.sqrt((x - (this.x + this.size/2))**2 + (y - (this.y + this.size/2))**2);
                return distance < this.size/2;
            }
        }

        class Bullet {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                const angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 8;
                this.dx = Math.cos(angle) * this.speed;
                this.dy = Math.sin(angle) * this.speed;
                this.life = 100;
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.life--;
            }

            draw() {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnBird() {
            if (gameState.gameRunning && Math.random() < 0.7) {
                gameState.birds.push(new Bird());
            }
        }

        function updateGame() {
            if (!gameState.gameRunning) return;

            // อัพเดทนก
            gameState.birds = gameState.birds.filter(bird => {
                bird.update();
                return bird.x < canvas.width + 50;
            });

            // อัพเดทกระสุน
            gameState.bullets = gameState.bullets.filter(bullet => {
                bullet.update();
                return bullet.life > 0 && bullet.x >= 0 && bullet.x <= canvas.width && bullet.y >= 0 && bullet.y <= canvas.height;
            });

            // ตรวจสอบการชน
            gameState.bullets.forEach((bullet, bulletIndex) => {
                gameState.birds.forEach((bird, birdIndex) => {
                    if (bird.isHit(bullet.x, bullet.y)) {
                        gameState.score += bird.points;
                        gameState.birds.splice(birdIndex, 1);
                        gameState.bullets.splice(bulletIndex, 1);
                        
                        // เอฟเฟค
                        createHitEffect(bird.x + bird.size/2, bird.y + bird.size/2);
                    }
                });
            });

            updateUI();
        }

        function createHitEffect(x, y) {
            // สร้างเอฟเฟคการระเบิดง่ายๆ
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    ctx.fillStyle = `hsl(${Math.random() * 60 + 10}, 100%, 50%)`;
                    ctx.beginPath();
                    const effectX = x + (Math.random() - 0.5) * 30;
                    const effectY = y + (Math.random() - 0.5) * 30;
                    ctx.arc(effectX, effectY, Math.random() * 5 + 2, 0, Math.PI * 2);
                    ctx.fill();
                }, i * 50);
            }
        }

        function drawGame() {
            // ล้างหน้าจอ
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // วาดพื้นหลัง
            drawBackground();
            
            // วาดนก
            gameState.birds.forEach(bird => bird.draw());
            
            // วาดกระสุน
            gameState.bullets.forEach(bullet => bullet.draw());
        }

        function drawBackground() {
            // วาดพื้น
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            // วาดต้นไม้
            for(let i = 0; i < 5; i++) {
                const x = i * 160 + 50;
                const y = canvas.height - 100;
                
                // ลำต้น
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - 5, y - 60, 10, 60);
                
                // ใบไม้
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.arc(x, y - 60, 25, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('ammo').textContent = gameState.ammo;
            document.getElementById('time').textContent = gameState.timeLeft;
        }

        function gameLoop() {
            updateGame();
            drawGame();
        }

        function startGame() {
            gameState = {
                score: 0,
                ammo: 10,
                timeLeft: 60,
                gameRunning: true,
                birds: [],
                bullets: []
            };
            
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
            
            // เริ่มเกม
            gameState.gameInterval = setInterval(gameLoop, 1000/60); // 60 FPS
            gameState.spawnInterval = setInterval(spawnBird, 2000); // สร้างนกทุก 2 วินาที
            
            // นับถอยหลังเวลา
            const timeInterval = setInterval(() => {
                gameState.timeLeft--;
                updateUI();
                
                if (gameState.timeLeft <= 0 || gameState.ammo <= 0) {
                    endGame();
                    clearInterval(timeInterval);
                }
            }, 1000);
        }

        function endGame() {
            gameState.gameRunning = false;
            clearInterval(gameState.gameInterval);
            clearInterval(gameState.spawnInterval);
            
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Event listeners
        canvas.addEventListener('click', (e) => {
            if (!gameState.gameRunning || gameState.ammo <= 0) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // ยิงจากกลางด้านล่าง
            gameState.bullets.push(new Bullet(canvas.width/2, canvas.height - 50, x, y));
            gameState.ammo--;
            
            // เสียงยิง (จำลอง)
            playShootSound();
        });

        function playShootSound() {
            // สร้างเสียงยิงแบบง่ายๆ
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // เริ่มเกมครั้งแรก
        startGame();
    </script>
</body>
</html>
