<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Adventure - Mini Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 900px;
            height: 600px;
            background: #2c3e50;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #e74c3c, #f39c12);
            padding: 10px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .logo {
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .game-area {
            position: relative;
            height: 550px;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 50%, #8FBC8F 100%);
            overflow: hidden;
        }

        .player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #e74c3c;
            border-radius: 8px;
            bottom: 60px;
            left: 50px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .player::before {
            content: '😊';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        .platform {
            position: absolute;
            background: #8B4513;
            border-radius: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .platform1 {
            width: 200px;
            height: 20px;
            bottom: 40px;
            left: 20px;
        }

        .platform2 {
            width: 150px;
            height: 20px;
            bottom: 120px;
            left: 300px;
        }

        .platform3 {
            width: 180px;
            height: 20px;
            bottom: 200px;
            left: 150px;
        }

        .platform4 {
            width: 120px;
            height: 20px;
            bottom: 280px;
            left: 450px;
        }

        .coin {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #f1c40f;
            border-radius: 50%;
            animation: spin 2s linear infinite, float 3s ease-in-out infinite;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(241, 196, 15, 0.4);
        }

        .coin::before {
            content: '💎';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15px;
        }

        .coin1 {
            bottom: 85px;
            left: 100px;
        }

        .coin2 {
            bottom: 165px;
            left: 350px;
        }

        .coin3 {
            bottom: 245px;
            left: 200px;
        }

        .coin4 {
            bottom: 325px;
            left: 500px;
        }

        .enemy {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #e67e22;
            border-radius: 6px;
            animation: moveEnemy 4s linear infinite;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .enemy::before {
            content: '👹';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .clouds {
            position: absolute;
            top: 30px;
            width: 100%;
            height: 100px;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 25px;
            opacity: 0.8;
            animation: floatCloud 15s linear infinite;
        }

        .cloud1 {
            width: 80px;
            height: 40px;
            top: 20px;
            animation-delay: -5s;
        }

        .cloud2 {
            width: 100px;
            height: 50px;
            top: 60px;
            animation-delay: -10s;
        }

        .notification {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s;
            z-index: 100;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes moveEnemy {
            0% { left: -50px; }
            100% { left: 100%; }
        }

        @keyframes floatCloud {
            0% { left: -120px; }
            100% { left: 100%; }
        }

        .jump {
            animation: jumpAnimation 0.6s ease-out;
        }

        @keyframes jumpAnimation {
            0% { transform: translateY(0); }
            50% { transform: translateY(-60px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="logo">🎮 ROBLOX ADVENTURE</div>
            <div class="stats">
                <div>💎 คะแนน: <span id="score">0</span></div>
                <div>❤️ ชีวิต: <span id="lives">3</span></div>
                <div>⭐ เลเวล: <span id="level">1</span></div>
            </div>
        </div>

        <div class="game-area">
            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
            </div>

            <div class="player" id="player"></div>

            <div class="platform platform1"></div>
            <div class="platform platform2"></div>
            <div class="platform platform3"></div>
            <div class="platform platform4"></div>

            <div class="coin coin1" data-value="10"></div>
            <div class="coin coin2" data-value="15"></div>
            <div class="coin coin3" data-value="20"></div>
            <div class="coin coin4" data-value="25"></div>

            <div class="enemy" style="bottom: 65px;"></div>

            <div class="notification" id="notification"></div>

            <div class="controls">
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="rightBtn">→</div>
                <div class="control-btn" id="jumpBtn">↑</div>
                <div class="control-btn" id="resetBtn">🔄</div>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            score: 0,
            lives: 3,
            level: 1,
            playerX: 50,
            playerY: 60,
            isJumping: false
        };

        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const notification = document.getElementById('notification');

        function updateDisplay() {
            scoreEl.textContent = gameState.score;
            livesEl.textContent = gameState.lives;
            levelEl.textContent = gameState.level;
        }

        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = 'notification show';
            notification.style.background = type === 'success' ? 'rgba(46, 204, 113, 0.9)' : 'rgba(231, 76, 60, 0.9)';
            
            setTimeout(() => {
                notification.className = 'notification';
            }, 2000);
        }

        function movePlayer(direction) {
            if (direction === 'left' && gameState.playerX > 0) {
                gameState.playerX -= 20;
            } else if (direction === 'right' && gameState.playerX < 850) {
                gameState.playerX += 20;
            }
            
            player.style.left = gameState.playerX + 'px';
            checkCollisions();
        }

        function jumpPlayer() {
            if (!gameState.isJumping) {
                gameState.isJumping = true;
                player.classList.add('jump');
                
                setTimeout(() => {
                    player.classList.remove('jump');
                    gameState.isJumping = false;
                }, 600);

                checkCollisions();
            }
        }

        function checkCollisions() {
            // Check coin collection
            document.querySelectorAll('.coin').forEach(coin => {
                const coinRect = coin.getBoundingClientRect();
                const playerRect = player.getBoundingClientRect();
                
                if (Math.abs(coinRect.left - playerRect.left) < 30 && 
                    Math.abs(coinRect.top - playerRect.top) < 30) {
                    
                    const value = parseInt(coin.dataset.value);
                    gameState.score += value;
                    coin.style.display = 'none';
                    showNotification(`+${value} คะแนน! 💎`);
                    
                    // Level up every 100 points
                    if (gameState.score >= gameState.level * 100) {
                        gameState.level++;
                        showNotification(`เลเวลอัพ! เลเวล ${gameState.level} 🎉`);
                    }
                    
                    updateDisplay();
                }
            });
        }

        function resetGame() {
            gameState = {
                score: 0,
                lives: 3,
                level: 1,
                playerX: 50,
                playerY: 60,
                isJumping: false
            };
            
            player.style.left = gameState.playerX + 'px';
            
            // Show all coins again
            document.querySelectorAll('.coin').forEach(coin => {
                coin.style.display = 'block';
            });
            
            updateDisplay();
            showNotification('เกมรีเซ็ตแล้ว! เริ่มใหม่ 🎮');
        }

        // Event listeners
        document.getElementById('leftBtn').addEventListener('click', () => movePlayer('left'));
        document.getElementById('rightBtn').addEventListener('click', () => movePlayer('right'));
        document.getElementById('jumpBtn').addEventListener('click', jumpPlayer);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    movePlayer('left');
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    movePlayer('right');
                    break;
                case 'ArrowUp':
                case 'KeyW':
                case 'Space':
                    e.preventDefault();
                    jumpPlayer();
                    break;
                case 'KeyR':
                    resetGame();
                    break;
            }
        });

        // Auto-spawn enemies
        function spawnEnemy() {
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.bottom = Math.random() * 300 + 65 + 'px';
            document.querySelector('.game-area').appendChild(enemy);

            setTimeout(() => {
                if (enemy.parentNode) {
                    enemy.remove();
                }
            }, 4000);
        }

        // Spawn enemies periodically
        setInterval(spawnEnemy, 5000);

        // Welcome message
        setTimeout(() => {
            showNotification('ยินดีต้อนรับสู่ Roblox Adventure! 🎮');
        }, 1000);

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
