<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Fan Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
        }
        .play-button {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .play-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ยินดีต้อนรับสู่โลกของ Roblox!</h1>
    <p>นี่คือตัวอย่างหน้าเว็บที่สร้างด้วย HTML และ CSS เท่านั้น</p>
    <a href="#" class="play-button">▶️ เล่นเกมเลย!</a>
    <p style="margin-top: 20px;">*ปุ่มนี้เป็นเพียงปุ่มหลอก ไม่ใช่เกมจริงนะครับ</p>
</div>

</body>
</html>
