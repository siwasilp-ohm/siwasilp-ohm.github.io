<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - เกมงู</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
        }
        
        .author {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .game-board {
            width: 400px;
            height: 400px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto 20px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            border-radius: 12px;
        }
        
        .score {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #FFD700;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .controls p {
            margin: 8px 0;
            font-size: 16px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .food {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="author">siwasilp pornjumsilp</div>
        <h1>🐍 เกมงู</h1>
        <div class="score">คะแนน: <span id="score">0</span></div>
        <div class="game-board">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over" id="gameOver">
                <h2>เกมจบแล้ว!</h2>
                <p>คะแนนของคุณ: <span id="finalScore">0</span></p>
                <button class="restart-btn" onclick="restartGame()">เริ่มเกมใหม่</button>
            </div>
        </div>
        <div class="controls">
            <p>🎮 กดปุ่มลูกศรเพื่อเริ่มเล่น</p>
            <p>🍎 กินอาหารเพื่อเพิ่มคะแนน</p>
            <p>⚡ อย่าให้งูกินตัวเองหรือชนกำแพง!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = true;

        // ตรวจสอบการกินอาหารก่อนตรวจสอบการชนตัวเอง
        function checkFoodCollision(head) {
            return head.x === food.x && head.y === food.y;
        }

        // ตรวจสอบการชนตัวเอง
        function checkSelfCollision(head) {
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    return true;
                }
            }
            return false;
        }

        // สร้างอาหารในตำแหน่งที่ไม่ซ้ำกับงู
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        // วาดงู
        function drawSnake() {
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // หัวงู
                    ctx.fillStyle = '#4ECDC4';
                    ctx.shadowColor = '#4ECDC4';
                    ctx.shadowBlur = 10;
                } else {
                    // ตัวงู
                    ctx.fillStyle = '#45B7AA';
                    ctx.shadowBlur = 5;
                }
                
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
                ctx.shadowBlur = 0;
            });
        }

        // วาดอาหาร
        function drawFood() {
            ctx.fillStyle = '#FF6B6B';
            ctx.shadowColor = '#FF6B6B';
            ctx.shadowBlur = 15;
            ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, gridSize - 8, gridSize - 8);
            ctx.shadowBlur = 0;
        }

        // เคลื่อนที่งู
        function moveSnake() {
            if (dx === 0 && dy === 0) return; // ไม่เคลื่อนที่ถ้ายังไม่เริ่มเกม
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // ตรวจสอบการชนกำแพง
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // ตรวจสอบการชนตัวเอง
            if (checkSelfCollision(head)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            // ตรวจสอบการกินอาหาร
            if (checkFoodCollision(head)) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        // วาดเกม
        function drawGame() {
            // ล้างหน้าจอ
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawSnake();
            drawFood();
        }

        // เกมจบ
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }

        // เริ่มเกมใหม่
        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            generateFood();
        }

        // ควบคุมงู
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            e.preventDefault(); // ป้องกันการเลื่อนหน้าจอ
            
            switch(e.key) {
                case 'ArrowUp':
                    if (dy !== 1) {
                        dx = 0;
                        dy = -1;
                    }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) {
                        dx = 0;
                        dy = 1;
                    }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) {
                        dx = -1;
                        dy = 0;
                    }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) {
                        dx = 1;
                        dy = 0;
                    }
                    break;
            }
        });

        // เริ่มเกมอัตโนมัติเมื่อกดปุ่มลูกศรครั้งแรก
        document.addEventListener('keydown', (e) => {
            if (gameRunning && dx === 0 && dy === 0) {
                switch(e.key) {
                    case 'ArrowUp':
                    case 'ArrowDown':
                    case 'ArrowLeft':
                    case 'ArrowRight':
                        // เริ่มเกมแล้วจึงให้เคลื่อนที่
                        break;
                }
            }
        });

        // เกมลูป
        function gameLoop() {
            if (gameRunning) {
                moveSnake();
            }
            drawGame();
        }

        // เริ่มเกม
        generateFood();
        setInterval(gameLoop, 150);
    </script>
</body>
</html>
